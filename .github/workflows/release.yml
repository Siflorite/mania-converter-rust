name: release

# Publish one release from a release branch.
# Prepare the version, Cargo.lock and the changelog entry with
#
#   bash ci/bump-lib X.Y.Z
#
# merge that PR to main, then push `release/X.Y.Z` from the merged commit.
# The `## vX.Y.Z` section of CHANGELOG.md is the release note; a push without a
# nonempty section only reports that it is waiting.

on:
  push:
    branches: ["release/**"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_HUSKY_DONT_INSTALL_HOOKS: "true"

jobs:
  checks:
    name: Release candidate checks
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      ready: ${{ steps.meta.outputs.ready }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Validate candidate and read the changelog
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$GITHUB_REF_NAME" =~ ^release/((0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*))$ ]]; then
            echo '::error::Use release/X.Y.Z.'
            exit 1
          fi
          version="${BASH_REMATCH[1]}"
          actual="$(cargo metadata --locked --no-deps --format-version 1 | jq -er '.packages[] | select(.name == "mania-converter") | .version')"
          if [[ "$version" != "$actual" ]]; then
            echo "::error::Branch version $version does not match the package version $actual."
            exit 1
          fi
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo 'ready=false' >> "$GITHUB_OUTPUT"

          # Take the section verbatim: from its heading to the next level-two
          # heading. Accept CRLF files.
          status=0
          awk -v heading="## v$version" '
            { sub(/\r$/, "") }
            $0 == heading { count++; selected = 1; next }
            /^##[[:space:]]/ { selected = 0 }
            selected { print; if ($0 ~ /[^[:space:]]/) nonempty = 1 }
            END { if (count > 1) exit 2; if (!count || !nonempty) exit 3 }
          ' CHANGELOG.md > "$RUNNER_TEMP/notes.md" || status=$?

          if [[ $status -eq 0 ]]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          elif [[ $status -eq 3 ]]; then
            echo "Waiting for a nonempty '## v$version' section in CHANGELOG.md; nothing was published." >> "$GITHUB_STEP_SUMMARY"
            echo "Generate it with: git cliff --unreleased --tag v$version --prepend CHANGELOG.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error::Cannot read the changelog (duplicate '## v$version' headings, or an unreadable CHANGELOG.md)."
            exit 1
          fi
      - uses: Swatinem/rust-cache@v2
        if: steps.meta.outputs.ready == 'true'
      - name: cargo fmt
        if: steps.meta.outputs.ready == 'true'
        run: cargo fmt --all --check
      - name: cargo clippy
        if: steps.meta.outputs.ready == 'true'
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: cargo test
        if: steps.meta.outputs.ready == 'true'
        run: cargo test --locked --workspace --all-features
      - name: cargo doc
        if: steps.meta.outputs.ready == 'true'
        run: cargo doc --locked --workspace --no-deps
      - uses: actions/upload-artifact@v4
        if: steps.meta.outputs.ready == 'true'
        with:
          name: release-notes
          path: ${{ runner.temp }}/notes.md
          if-no-files-found: error

  executables:
    name: Windows x64 executables
    needs: checks
    if: needs.checks.outputs.ready == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
      - name: Build the CLI and the Webapp
        run: cargo build --locked --release --target x86_64-pc-windows-msvc -p mania-converter-standalone -p mania-converter-webapp
      - name: Name the executables like the earlier releases
        shell: pwsh
        env:
          TAG: ${{ needs.checks.outputs.tag }}
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          foreach ($name in 'mania-converter-standalone', 'mania-converter-webapp') {
            $built = "target/x86_64-pc-windows-msvc/release/$name.exe"
            if (-not (Test-Path $built)) { throw "Missing $built" }
            Copy-Item $built "dist/$name-$env:TAG.exe"
          }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: dist/*.exe
          if-no-files-found: error

  publish:
    name: Tag and publish the release
    needs: [checks, executables]
    if: needs.checks.outputs.ready == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: release-notes
          path: ${{ runner.temp }}
      - uses: actions/download-artifact@v4
        with:
          name: windows-x64
          path: dist
      - name: Create the release at the tested commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.checks.outputs.tag }}
        run: |
          set -euo pipefail
          existing="$(git rev-parse --verify --quiet "refs/tags/$TAG^{commit}" || true)"
          if [[ -n "$existing" && "$existing" != "$GITHUB_SHA" ]]; then
            echo "::error::Tag $TAG points at $existing, not the tested commit. Bump the version instead of moving a published tag."
            exit 1
          fi

          # Listing releases must succeed; network or auth errors are not "absent".
          release_url="$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases" \
            --jq ".[] | select(.tag_name == \"$TAG\") | .html_url")"
          if [[ -n "$release_url" ]]; then
            # Same version and same commit: this is a retry, so only make sure
            # the executables are attached instead of recreating the release.
            test "$existing" = "$GITHUB_SHA"
            echo "Release already exists: $release_url"
            gh release upload "$TAG" dist/*.exe --repo "$GITHUB_REPOSITORY" --clobber
            exit 0
          fi

          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --latest=false \
            dist/*.exe

# Release notes are generated from the previous version tag to the CI commit.
# Non-conventional commits are retained so older history is not silently lost.
# `header` is the title of CHANGELOG.md: `--prepend` strips it from the existing
# file and writes the new release directly below it, instead of on top of it.
[changelog]
header = "# mania-converter changelog"
body = """
## {{ version }}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in commits %}\
- {% if commit.breaking %}**BREAKING:** {% endif %}\
{% if commit.scope %}**{{ commit.scope }}:** {% endif %}\
{{ commit.message | split(pat="\n") | first }} ({{ commit.id | truncate(length=7, end="") }})
{% endfor %}
{% endfor %}
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = false
split_commits = false
protect_breaking_commits = true
commit_parsers = [
  { message = "^Merge", skip = true },
  { message = "^bump", skip = true },
  { message = "^feat", group = "<!-- 0 -->Added" },
  { message = "^fix", group = "<!-- 1 -->Fixed" },
  { message = "^perf", group = "<!-- 2 -->Performance" },
  { message = "^refactor", group = "<!-- 3 -->Changed" },
  { message = "^docs", group = "<!-- 4 -->Documentation" },
  { message = "^test", group = "<!-- 5 -->Tests" },
  { message = "^(build|ci|chore|style)", group = "<!-- 6 -->Maintenance" },
  { message = ".*", group = "<!-- 7 -->Other changes" },
]
filter_commits = false
tag_pattern = "^v[0-9]+\\.[0-9]+\\.[0-9]+.*$"
sort_commits = "oldest"

[package]
name = "mania-converter"
version.workspace = true
authors = ["Siflorite <monokhrom@163.com>"]
edition.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[workspace]
members = ["binaries/webapp", "binaries/standalone"]

[workspace.package]
version = "0.6.1"
edition = "2024"

[dependencies]
walkdir = "2.5"
zip = "8"
tempfile = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1"
# For picture generation
handlebars = "6"
resvg = "0.48"

[dev-dependencies]
cargo-husky = { version = "1.5", features = ["user-hooks"] }

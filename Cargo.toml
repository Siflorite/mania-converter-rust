[package]
name = "mania-converter"
version = "0.6.0"
authors = ["Siflorite <monokhrom@163.com>"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[workspace]
members = ["binaries/webapp", "binaries/standalone"]

[dependencies]
walkdir = "2.5"
zip = "8"
tempfile = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1"
# For picture generation
handlebars = "6"
resvg = "0.45"
anyhow = "1.0.100"

[dev-dependencies]
cargo-husky = { version = "1.5", features = ["user-hooks"] }